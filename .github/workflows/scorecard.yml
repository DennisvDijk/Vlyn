name: OpenSSF Scorecard

on:
  schedule:
    - cron: '30 6 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      # upload-sarif uses the same code scanning API as CodeQL. Skip it on a
      # private repository unless ENABLE_CODEQL=true. The Scorecard run above
      # still produces results.sarif in the log.
      - name: Decide whether code scanning can accept SARIF
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE: ${{ vars.ENABLE_CODEQL }}
        run: |
          set -euo pipefail
          visibility=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)
          echo "Repository visibility: ${visibility}"
          if [[ "$visibility" == "public" || "$ENABLE" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SARIF upload. Code scanning is not enabled for a ${visibility} repository without GitHub Code Security."
          fi
      - name: Upload SARIF
        if: steps.upload.outputs.run == 'true'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

name: OpenSSF Scorecard

on:
  schedule:
    - cron: '30 6 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      # Scorecard's default token cannot ListCommits on a private repository
      # (Resource not accessible by integration), so the action fails the job.
      # A public repository, or ENABLE_SCORECARD=true, runs it. The SARIF upload
      # still needs code scanning, which is the ENABLE_CODEQL gate.
      - name: Decide whether Scorecard can read this repository
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE: ${{ vars.ENABLE_SCORECARD }}
        run: |
          set -euo pipefail
          visibility=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)
          echo "Repository visibility: ${visibility}"
          if [[ "$visibility" == "public" || "$ENABLE" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scorecard will run."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Scorecard."
            echo "On a private repository the default token cannot list commits."
            echo "Set the Actions variable ENABLE_SCORECARD to true to opt in."
            echo "A public repository runs Scorecard with no variable set."
          fi
      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        if: steps.gate.outputs.run == 'true'
        # v2.6.0 points to a container tag that is currently missing from GHCR.
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Decide whether code scanning can accept SARIF
        id: upload
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE: ${{ vars.ENABLE_CODEQL }}
        run: |
          set -euo pipefail
          visibility=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)
          echo "Repository visibility: ${visibility}"
          if [[ "$visibility" == "public" || "$ENABLE" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SARIF upload. Code scanning is not enabled for a ${visibility} repository without GitHub Code Security."
          fi
      - name: Upload SARIF
        if: steps.gate.outputs.run == 'true' && steps.upload.outputs.run == 'true'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
